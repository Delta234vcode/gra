<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Big Life: Ticket Match</title>
    
    <!-- Tailwind CSS for styling --><script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter --><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Tone.js for sound effects --><script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    
    <!-- Telegram Web App script --><script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="overflow-hidden">

    <!-- App Container --><div id="app-container" class="w-screen h-screen max-w-full max-h-full">

        <!-- Loading Screen --><div id="loading-screen" class="w-full h-full flex flex-col items-center justify-center fade-in">
            <h1 class="text-4xl font-black neon-text">Big Life</h1>
            <p class="text-lg text-slate-400">Ticket Match</p>
            <div class="w-1/2 h-2 mt-8 bg-slate-700 rounded-full overflow-hidden">
                <div id="loading-bar" class="h-full bg-gradient-to-r from-purple-500 to-green-400" style="width: 0%;"></div>
            </div>
        </div>
        
        <!-- Start Screen --><div id="start-screen" class="w-full h-full flex flex-col items-center justify-center p-8 text-center hidden">
             <h1 class="text-6xl md:text-8xl font-black text-white" style="text-shadow: 0 0 15px rgba(255,255,255,0.5), 0 0 30px rgba(139, 92, 246, 0.7);">Big Life</h1>
            <p class="text-2xl md:text-3xl text-slate-300 mb-4 neon-text">Ticket Match</p>
            <div class="mb-4 flex flex-col items-center gap-2">
                <span class="text-xs uppercase text-slate-500" data-i18n="language">Language</span>
                <div class="flex gap-3">
                    <button class="lang-btn p-2 rounded-md border-2 border-slate-600" data-lang="en">EN</button>
                    <button class="lang-btn p-2 rounded-md border-2 border-slate-600" data-lang="ru">RU</button>
                    <button class="lang-btn p-2 rounded-md border-2 border-slate-600" data-lang="ua">UA</button>
                </div>
            </div>
            <p id="start-prompt" class="text-sm md:text-base text-slate-400 max-w-md mb-4" data-i18n="start_prompt"></p>
            <div id="instructions-box" class="bg-slate-800/70 rounded-lg p-4 max-w-md mb-6 text-left">
                <h3 class="text-sm font-bold text-slate-300 mb-2" data-i18n="how_to_play">How to play</h3>
                <p id="instructions-text" class="text-xs md:text-sm text-slate-400 whitespace-pre-line" data-i18n="instructions"></p>
            </div>
            <button id="start-button" class="px-12 py-4 text-2xl font-bold rounded-lg bg-purple-600 text-white neon-button" data-i18n="play">Start</button>
        </div>

        <!-- Game Screen --><div id="game-screen" class="w-full h-screen flex flex-col md:flex-row p-2 md:p-4 gap-4 hidden">
            <!-- Character Panel --><div id="character-panel" class="flex flex-row md:flex-col items-center gap-2 w-full md:w-1/3 flex-shrink-0 bg-slate-900/50 rounded-lg p-2 md:p-0 md:overflow-hidden">
                <div id="character-avatar" class="w-24 h-24 md:w-full md:h-auto md:aspect-square flex-shrink-0 breathe">
                    <img id="character-image" src="" alt="Game Character">
                </div>
                <div class="flex-1 h-full bg-slate-800/70 rounded-lg p-2 md:p-3 text-center flex items-center justify-center">
                    <p id="character-line" class="text-xs md:text-base"></p>
                </div>
            </div>

            <!-- Game Panel --><div class="flex-1 flex flex-col min-w-0">
                <!-- HUD --><div id="hud" class="w-full grid grid-cols-3 gap-2 mb-2 text-center">
                    <div class="bg-slate-900/50 rounded-lg p-2">
                        <span class="text-xs uppercase text-slate-400" data-i18n="score">Score</span>
                        <p id="score-value" class="text-xl font-bold">0</p>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-2">
                        <span id="moves-time-label" class="text-xs uppercase text-slate-400" data-i18n="moves">Moves</span>
                        <p id="moves-time-value" class="text-xl font-bold">25</p>
                    </div>
                    <div class="bg-slate-900/50 rounded-lg p-2">
                        <span class="text-xs uppercase text-slate-400" data-i18n="level">Level</span>
                        <p id="level-value" class="text-xl font-bold">1</p>
                    </div>
                </div>
                <!-- Game Grid --><div id="game-grid-container" class="flex-1 w-full h-full flex items-center justify-center aspect-square relative">
                    <div id="game-grid" class="w-full h-full bg-slate-800/50 rounded-lg p-1 aspect-square"></div>
                    <div id="combo-multiplier" class="absolute top-2 right-2 text-2xl font-black text-yellow-300" style="display: none; text-shadow: 2px 2px 2px #000;"></div>
                </div>
                 <div class="flex justify-center items-center gap-4 mt-2 flex-wrap">
                    <button id="shuffle-button" class="p-2 bg-slate-900/50 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed" data-i18n="shuffle">Shuffle</button>
                    <button id="sound-toggle" class="p-2 bg-slate-900/50 rounded-lg">рџ”Љ</button>
                    <button id="close-button" class="p-2 bg-slate-900/50 rounded-lg" data-i18n="close">Close</button>
                </div>
            </div>
        </div>
        
        <!-- Modal --><div id="modal" class="modal-backdrop hidden fade-in">
            <div id="modal-content" class="modal-content p-8 rounded-lg text-center w-11/12 max-w-sm slide-in-up">
                <h2 id="modal-title" class="text-3xl font-bold mb-4"></h2>
                <p id="modal-body" class="text-lg mb-6"></p>
                <div id="modal-buttons" class="flex justify-center gap-4"></div>
            </div>
        </div>

        <!-- Level Transition Screen --><div id="level-transition-screen" class="modal-backdrop hidden">
            <div class="text-center text-white">
                <img id="transition-image" src="" class="max-w-xs mx-auto rounded-lg mb-4">
                <p id="transition-text" class="text-2xl font-bold neon-text"></p>
            </div>
        </div>

        <!-- Win Video Screen --><div id="win-video-container" class="modal-backdrop hidden items-center justify-center">
            <video id="win-video" class="w-full h-auto max-h-full max-w-full" src="https://files.catbox.moe/0rlf1s.mp4" muted playsinline></video>
            <audio id="win-audio" src="https://files.catbox.moe/493uhj.mp3" preload="auto"></audio>
        </div>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
