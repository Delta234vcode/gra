:root{--bg:#0b0f1a;--text:#E5E7EB;--primary:#21F2A4;--accent:#8B5CF6;--info:#0EA5E9;--danger:#EF4444}

.neon-text{text-shadow:0 0 5px var(--primary),0 0 10px var(--primary),0 0 15px var(--primary)}

#start-button{animation:button-pulse 2s infinite ease-in-out}
#game-grid{display:grid;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game-grid-container{touch-action:none}
.tile{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,40px);cursor:pointer;user-select:none;transition:transform .12s ease-in-out}
.tile img{width:90%;height:90%;object-fit:contain;pointer-events:none}
.tile .lock-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.2em;color:#fff;text-shadow:0 0 5px #000;background:rgba(0,0,0,.3);border-radius:20%;z-index:10}
.tile.selected{transform:scale(1.1);background:rgba(33,242,164,.2);border-radius:20%}
#bonus-character{position:absolute;z-index:20;cursor:pointer;transition:transform .3s,opacity .3s}
#bonus-character:hover{transform:scale(1.1)}
@keyframes bonus-in{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bonus-out{0%{transform:scale(1);opacity:1}100%{transform:scale(.5);opacity:0}}
#bonus-notification{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;padding:8px 16px;background:var(--primary);color:var(--bg);font-weight:700;border-radius:99px;pointer-events:none;animation:bonus-pop 1.5s ease-out forwards}
@keyframes bonus-pop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.1);opacity:1}80%{transform:translate(-50%,-70%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.5);opacity:0}}
@keyframes unlock-pop{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}.fade-in{animation:fadeIn .3s ease-in-out}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}.fade-out{animation:fadeOut .5s ease-in-out forwards}
@keyframes slideInUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}.slide-in-up{animation:slideInUp .4s cubic-bezier(.25,.46,.45,.94)}
@keyframes match-pop{0%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.8}100%{transform:scale(0);opacity:0}}.tile.matched{animation:match-pop .18s ease-out forwards}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}.shake{animation:shake .3s ease-in-out}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}.nod{animation:nod .5s ease-in-out}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}.breathe{animation:breathe 3s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.7}}
.particle{position:absolute;background:var(--primary);border-radius:50%;pointer-events:none;opacity:0;animation-duration:.5s;animation-timing-function:ease-out;animation-fill-mode:forwards}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-content{background:var(--bg);border:2px solid var(--accent);box-shadow:0 0 20px var(--accent)}
#game-screen.level-1{background-image:radial-gradient(circle at top,rgba(139,92,246,.2) 0%,transparent 40%),linear-gradient(180deg,#1e293b 0%,var(--bg) 100%)}
#game-screen.level-2{background-image:radial-gradient(circle at top,rgba(239,68,68,.2) 0%,transparent 40%),linear-gradient(180deg,#1e293b 0%,var(--bg) 100%)}

#character-avatar img{width:100%;height:100%;object-fit:contain}

function createParticles(el){const rect=el.getBoundingClientRect(),cr=DOMElements.grid.getBoundingClientRect();for(let i=0;i<10;i++){const p=document.createElement('div');p.className='particle';const size=Math.random()*5+2;p.style.width=size+'px';p.style.height=size+'px';p.style.left=(rect.left-cr.left+rect.width/2)+'px';p.style.top=(rect.top-cr.top+rect.height/2)+'px';const angle=Math.random()*360,dist=Math.random()*40+20,tx=Math.cos(angle*Math.PI/180)*dist,ty=Math.sin(angle*Math.PI/180)*dist,name='particle-'+Date.now()+'-'+i;p.style.animationName=name;const kf='@keyframes '+name+' {0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate('+tx+'px,'+ty+'px) scale(0);opacity:0}}';if(state.dynamicStyleSheet.cssRules.length>50)state.dynamicStyleSheet.deleteRule(0);state.dynamicStyleSheet.insertRule(kf,state.dynamicStyleSheet.cssRules.length);el.parentElement.appendChild(p);setTimeout(()=>p.remove(),500);}}
async function cascadeAndRefill(){for(let c=0;c<state.gridSize;c++){let emptyRow=state.gridSize-1;for(let r=state.gridSize-1;r>=0;r--)if(state.board[r][c]!==null){if(r!==emptyRow){state.board[emptyRow][c]=state.board[r][c];state.board[r][c]=null;state.board[emptyRow][c].element.dataset.r=emptyRow;}emptyRow--;}}for(let c=0;c<state.gridSize;c++)for(let r=0;r<state.gridSize;r++)if(state.board[r][c]===null)createTile(r,c,TILE_TYPES[Math.floor(Math.random()*TILE_TYPES.length)],false);DOMElements.grid.innerHTML='';const frag=document.createDocumentFragment();for(let r=0;r<state.gridSize;r++)for(let c=0;c<state.gridSize;c++)frag.appendChild(state.board[r][c].element);DOMElements.grid.appendChild(frag);await new Promise(r=>setTimeout(r,100));}
function checkForPossibleMoves(){for(let r=0;r<state.gridSize;r++)for(let c=0;c<state.gridSize;c++){if(state.board[r][c]&&state.board[r][c].locked)continue;if(c<state.gridSize-1&&state.board[r][c+1]&&!state.board[r][c+1].locked){[state.board[r][c],state.board[r][c+1]]=[state.board[r][c+1],state.board[r][c]];if(findMatches().size>0){[state.board[r][c],state.board[r][c+1]]=[state.board[r][c+1],state.board[r][c]];return true;}[state.board[r][c],state.board[r][c+1]]=[state.board[r][c+1],state.board[r][c]];}if(r<state.gridSize-1&&state.board[r+1][c]&&!state.board[r+1][c].locked){[state.board[r][c],state.board[r+1][c]]=[state.board[r+1][c],state.board[r][c]];if(findMatches().size>0){[state.board[r][c],state.board[r+1][c]]=[state.board[r+1][c],state.board[r][c]];return true;}[state.board[r][c],state.board[r+1][c]]=[state.board[r+1][c],state.board[r][c]];}}return false;}
async function reshuffleGrid(){state.isLocked=true;DOMElements.grid.classList.add('shake');await new Promise(r=>setTimeout(r,500));DOMElements.grid.classList.remove('shake');setupGrid();state.isLocked=false;}
function startCombo(){clearTimeout(state.comboTimeout);state.comboCount++;DOMElements.comboMultiplier.textContent='x'+(1+state.comboCount*.2).toFixed(1);DOMElements.comboMultiplier.style.display='block';state.comboTimeout=setTimeout(endCombo,1200);}
function endCombo(){state.comboCount=0;DOMElements.comboMultiplier.style.display='none';}
function scheduleBonusCharacter(){if(state.bonus.hasAppeared)return;state.bonus.timer=setTimeout(showBonusCharacter,Math.random()*10000+10000);}
function showBonusCharacter(){if(state.isLocked||state.bonus.active||state.bonus.hasAppeared)return;state.bonus.active=true;state.bonus.hasAppeared=true;const el=document.createElement('img');el.src=BONUS_CHARACTER_IMAGE;el.id='bonus-character';const ts=DOMElements.grid.clientWidth/state.gridSize;el.style.width=ts+'px';el.style.height=ts+'px';const r=Math.floor(Math.random()*state.gridSize),c=Math.floor(Math.random()*state.gridSize);el.style.top=r*ts+'px';el.style.left=c*ts+'px';el.style.animation='bonus-in .3s ease-out forwards';el.onclick=onBonusClick;state.bonus.element=el;DOMElements.gridContainer.appendChild(el);state.bonus.timer=setTimeout(clearBonusCharacter,4000);}
function onBonusClick(){if(!state.bonus.active)return;playSound('bonus');const pts=BONUS_POINTS[state.currentLevel];state.score+=pts;updateHUD();const n=document.createElement('div');n.id='bonus-notification';n.textContent=t('bonus_points',{points:'+'+pts});DOMElements.gridContainer.appendChild(n);setTimeout(()=>n.remove(),1500);clearBonusCharacter();}
function clearBonusCharacter(){clearTimeout(state.bonus.timer);const el=state.bonus.element;if(el){el.style.animation='bonus-out .3s ease-in forwards';setTimeout(()=>{if(el.parentNode)el.remove();},300);}state.bonus.active=false;state.bonus.element=null;}
function endLevel(isWin){state.isLocked=true;clearBonusCharacter();if(state.timerInterval)clearInterval(state.timerInterval);if(isWin){playSound('win');if(state.currentLevel<LEVEL_CONFIG.length-1)showLevelTransition();else{DOMElements.transitionImage.src=TRANSITION_IMAGES.final;DOMElements.transitionText.textContent=t('prod_l3_pass');DOMElements.levelTransitionScreen.classList.remove('hidden');DOMElements.levelTransitionScreen.classList.add('fade-in');setTimeout(()=>{DOMElements.levelTransitionScreen.classList.add('hidden');DOMElements.winVideoContainer.classList.remove('hidden');DOMElements.winVideo.play();if(state.settings.sound)DOMElements.winAudio.play();DOMElements.winVideo.onended=()=>{window.location.href='https://big-life.org/';};},5000);}}else{playSound('fail');const cfg=LEVEL_CONFIG[state.currentLevel];const bp=cfg.moves?{target:cfg.target,moves:cfg.moves}:{target:cfg.target,time:cfg.timer};showModal({titleKey:'level_fail',bodyKey:cfg.moves?'fail_moves':'fail_time',bodyParams:bp,buttons:[{textKey:'replay',action:()=>startLevel(state.currentLevel)}]});}}
function updateSoundButton(){DOMElements.soundToggle.textContent=state.settings.sound?'🔊':'🔇';}
function init(){const styleEl=document.createElement('style');document.head.appendChild(styleEl);state.dynamicStyleSheet=styleEl.sheet;const saved=localStorage.getItem('biglife_settings');if(saved)state.settings=JSON.parse(saved);else{try{if(typeof Telegram!=='undefined'&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user&&locales[Telegram.WebApp.initDataUnsafe.user.language_code])state.settings.lang=Telegram.WebApp.initDataUnsafe.user.language_code;}catch(e){}}const MIN_LOAD=800,start=Date.now(),urls=getAllImageUrls(),total=urls.length;let loaded=0;function setPct(p){DOMElements.loadingBar.style.width=Math.min(100,Math.round(p))+'%';}function tryFinish(){if(loaded<total)return;const elapsed=Date.now()-start,wait=Math.max(0,MIN_LOAD-elapsed);setTimeout(()=>{setPct(100);setTimeout(()=>showScreen(DOMElements.startScreen),200);},wait);}if(total===0)tryFinish();else urls.forEach(url=>{const img=new Image();img.onload=img.onerror=()=>{loaded++;setPct(loaded/total*98);tryFinish();};img.src=url;});initSounds();applyLocalization();updateSoundButton();DOMElements.startButton.onclick=()=>{Tone.start();startLevel(0);};document.querySelectorAll('.lang-btn').forEach(btn=>{btn.onclick=()=>{state.settings.lang=btn.dataset.lang;localStorage.setItem('biglife_settings',JSON.stringify(state.settings));applyLocalization();};});const opt={passive:false};if('ontouchstart' in window||navigator.maxTouchPoints>0)DOMElements.grid.addEventListener('touchstart',handlePointerStart,opt);else DOMElements.grid.addEventListener('pointerdown',handlePointerStart,opt);DOMElements.shuffleButton.onclick=async()=>{if(state.shufflesLeft<=0||state.isLocked)return;state.shufflesLeft--;await reshuffleGrid();updateHUD();};DOMElements.soundToggle.onclick=()=>{state.settings.sound=!state.settings.sound;updateSoundButton();localStorage.setItem('biglife_settings',JSON.stringify(state.settings));};DOMElements.closeButton.onclick=()=>{try{Telegram.WebApp.close();}catch(e){alert('Closing...');}};}
window.addEventListener('load',init);
    </script>
</body>
